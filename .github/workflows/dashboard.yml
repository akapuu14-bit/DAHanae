name: dashboard

on:
  issues:
    types: [opened, closed, edited, reopened]
  pull_request:
    types: [opened, closed, edited, reopened]
  push:
    branches: [main]
  schedule:
    # 毎日1回（UTC 21:00 = JST 06:00）
    - cron: "0 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/gen_dashboard.py

      - name: Copy dev hub and overview into Pages output
        run: mkdir -p site && cp docs/hub.html site/hub.html && cp docs/overview.html site/overview.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
