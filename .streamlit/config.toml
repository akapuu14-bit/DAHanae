# 見た目（テーマ）の設定。色とフォントだけを決めていて、画面のコードには触れない。
# 細かい見た目（ホバー・角丸・余白）は app/frontend/assets/style.css にある。
# 配色を差し替えるときは、この [theme] と style.css 先頭の色の変数を同時に変える。
# 現在は C 案（春：アイボリー × 若葉 × 桜）。設計方針は「UI/UX再設計方針」ドキュメントを参照。

[theme]
base = "light"
primaryColor = "#3B7D59"
backgroundColor = "#F9F7F0"
secondaryBackgroundColor = "#F1EEE3"
textColor = "#2F2A26"
font = "sans serif"
